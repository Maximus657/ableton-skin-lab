[package]
name = "ableton-skin-lab"
version = "1.1.0"
edition = "2021"
description = "Pictures and colour themes for Ableton Live"
authors = ["blueberry"]
license = "MIT"
repository = "https://github.com/Maximus657/ableton-skin-lab"

[[bin]]
name = "AbletonSkinLab"
path = "src/main.rs"

[dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_System_Com",
  "Win32_System_LibraryLoader","Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry","Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
eframe = "0.31"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
